<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EmpowerZ (R26-SE-010): an AI-driven multimodal soft skills training and feedback platform for Gen Z employees. SLIIT final year research project 2026."
    />
    <meta name="theme-color" content="#f4f3f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0c10" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <title>EmpowerZ | R26-SE-010</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
